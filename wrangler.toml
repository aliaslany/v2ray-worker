name = "sub"
main = "src/worker.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "settings", id = "e0f718cbc09c40259878f6c272262b52" }
]

# Refreshes the proxy IP health cache every 6 hours (see src/proxy-manager.ts).
# Cron Triggers need to be enabled once from the Cloudflare dashboard/CLI after first deploy
# if you're deploying via the "Deploy with Workers" button rather than `wrangler deploy`.
[triggers]
crons = ["0 */6 * * *"]

# Observability / logging. The top-level `enabled` is the master switch — it must be true
# for the logs/traces sub-sections below to take effect at all, regardless of their own
# `enabled` values. This was previously set to false while observability.logs.enabled was
# true, which is why nothing showed up in the dashboard's live Logs view.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
